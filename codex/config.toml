model = "gpt-5.4"
plan_mode_reasoning_effort = "high"
model_reasoning_effort = "high"

[features]
js_repl = true
multi_agent = true
apps = false
prevent_idle_sleep = true
fast_mode = true
child_agents_md = true

[plugins."parallel@parallel-agent-skills"]
enabled = true

[marketplaces.parallel-agent-skills]
source = "github"
repo = "parallel-web/parallel-agent-skills"


[agents]
max_threads = 20
max_depth = 3
